{% load static %}
<form method="post" action="{% url 'organisation:ajuster_repartition' session.pk %}"
      class="inline-flex items-center justify-end gap-1.5">
  {% csrf_token %}
  <input type="hidden" name="proposition_b64" value="{{ proposition_b64 }}">
  <input type="hidden" name="stagiaire_id" value="{{ stagiaire.pk }}">
  <select name="brigade_id" aria-label="Brigade pour {{ stagiaire }}"
          class="h-controle rounded border border-gris-trait bg-fond-bloc px-2 text-xs
                 outline-none hover:border-marine-700
                 focus:border-marine-700 focus:ring-2 focus:ring-focus">
    <option value="" {% if brigade_courante is None %}selected{% endif %}>Non affecté</option>
    {% for brigade in brigades %}
      <option value="{{ brigade.pk }}" {% if brigade.pk == brigade_courante %}selected{% endif %}>
        {{ brigade.designation }}</option>
    {% endfor %}
  </select>
  <button type="submit"
          class="inline-flex h-controle items-center border border-marine-900 px-2.5 text-xs
                 font-semibold text-marine-900 transition-colors duration-survol hover:bg-fond-survol">
    Déplacer
  </button>
</form>
