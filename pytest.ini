[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
pythonpath = app
testpaths = tests app
python_files = test_*.py
addopts = --strict-markers --reuse-db
markers =
    pdf: produit réellement un PDF via WeasyPrint — ignoré sous Windows (bibliothèques natives absentes), à exécuter dans le conteneur de production (python:3.14-slim-bookworm). Fait partie de la définition de fini de toute story qui produit un PDF (.claude/rules/tests.md).
