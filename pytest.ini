[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
pythonpath = app
testpaths = tests app
python_files = test_*.py
addopts = --strict-markers --reuse-db
markers =
    pdf: produit réellement un PDF via WeasyPrint — ignoré sous Windows (bibliothèques natives absentes), à exécuter dans le conteneur de production (python:3.14-slim-bookworm). Fait partie de la définition de fini de toute story qui produit un PDF (.claude/rules/tests.md).
    navigateur: ouvre un vrai Chromium (Playwright, prompt 54 bis) pour vérifier un rendu que les gabarits seuls ne peuvent pas prouver (impression). Jamais lancé par défaut (voir conftest.py racine) — `pytest -m navigateur`, après `playwright install chromium` (requirements-dev.txt, poste de développement seulement).
    plafond_session_entiere: rejoue une session entière (~11,6 semaines), deux brigades, génération réelle semaine par semaine (prompt 56, RG-66) — lent, mais fait partie de la suite complète, jamais ignoré par défaut.
